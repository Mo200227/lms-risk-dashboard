<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Active – AI LMS Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Top bar -->
  <div class="topbar">
    <div class="crumbs">Courses / <strong>Dynamic Active</strong></div>

    <div class="topbar-right">
      <div class="search-wrap">
        <input
          id="searchInput"
          class="search"
          placeholder="Search students..."
          autocomplete="off"
        />
        <div id="searchDropdown" class="search-dropdown" style="display:none;"></div>
      </div>

      <div class="avatar" title="Mohsin">M</div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h2 class="logo">Dynamic Active</h2>

      <nav class="nav">
        <button id="tabTeacher" class="nav-btn active">Dashboard</button>
        <button id="tabStudent" class="nav-btn">Students</button>
        <button id="tabLesson" class="nav-btn">Lessons</button>
        <button id="tabInsights" class="nav-btn">AI Insights</button>
      </nav>

      <div class="sidebar-foot">
        <label class="toggle">
          <input id="toggleAi" type="checkbox" checked />
          <span>AI Suggestions</span>
        </label>
        <p class="muted small">Prototype • No backend</p>
      </div>
    </aside>

    <main class="main">
      <!-- Dynamic header -->
      <header class="page-header">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Monitor progress, spot risk early, and take action.</p>
        <p id="pageSubtitle" class="subtitle">
          Teacher-first LMS prototype with explainable, rule-based “AI” insights.
        </p>
      </header>

      <section id="viewWelcome"></section>
      <section id="viewStudent" style="display:none;"></section>
      <section id="viewLesson" style="display:none;"></section>
      <section id="viewInsights" style="display:none;"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
